<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carte des lectures d'ailleurs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  header {
    position: absolute; top: 0; left: 0; z-index: 1000;
    background: rgba(255, 255, 255, 0.9); padding: 0.5em 1em;
    border-bottom-right-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  header h1 { margin: 0; font-size: 1.1em; }
  #book-detail {
    position: absolute; top: 0; right: 0; z-index: 1000;
    width: min(320px, 90vw); height: 100%; overflow-y: auto;
    background: white; box-shadow: -2px 0 8px rgba(0,0,0,0.2);
    padding: 1em; box-sizing: border-box;
  }
  #book-detail img { width: 100%; border-radius: 4px; }
  #book-detail-close {
    float: right; border: none; background: none; font-size: 1.5em;
    cursor: pointer; line-height: 1;
  }
  .book-meta { color: #555; }
  .book-edition { font-size: 0.85em; color: #888; }
</style>
</head>
<body>
<header><h1>Carte des lectures d'ailleurs</h1></header>
<div id="map"></div>
<aside id="book-detail" hidden></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
